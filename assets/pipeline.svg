<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="LeanChip pipeline: schematic PDF and BOM become a golden netlist; generated Lean data feeds the Lean 4 kernel, which proves 37 theorems; outputs are the firmware LED tables, the photon-dose ceilings and the board check">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0B1A33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111D36"/><stop offset="1" stop-color="#0B1528"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B9A7FF" stop-opacity="0.45"/><stop offset="1" stop-color="#B9A7FF" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#B9A7FF"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#B9A7FF" stroke-opacity="0.06" stroke-width="1.5">
    <path d="M0 520 C 300 490 600 550 900 510 S 1400 480 1600 520"/>
  </g>

  <text x="800" y="62" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="34" font-weight="700" fill="#F3EFE6">Schematic <tspan fill="#B9A7FF">⊢</tspan> Proof <tspan fill="#B9A7FF">⊢</tspan> Photons</text>
  <path d="M400 50 L 520 50 M1080 50 L 1200 50" stroke="#B9A7FF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- ===== panel 1: design data ===== -->
  <g transform="translate(60 110)">
    <rect width="400" height="380" rx="18" fill="url(#card)" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="24" y="44" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#2DD4BF">1 · Golden netlist</text>
    <text x="24" y="72" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#C9D3DC" fill-opacity="0.8">Sierrathon PDF + BOM.xlsx</text>
    <!-- mini netlist graph -->
    <g stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.6">
      <line x1="200" y1="190" x2="90" y2="130"/><line x1="200" y1="190" x2="310" y2="130"/>
      <line x1="200" y1="190" x2="80" y2="230"/><line x1="200" y1="190" x2="320" y2="230"/>
      <line x1="200" y1="190" x2="140" y2="280"/><line x1="200" y1="190" x2="260" y2="280"/>
      <line x1="90" y1="130" x2="80" y2="230"/><line x1="310" y1="130" x2="320" y2="230"/>
    </g>
    <rect x="166" y="166" width="68" height="48" rx="6" fill="#1A1F2B" stroke="#3A4256"/>
    <text x="200" y="195" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#C9D3DC">RP2040</text>
    <g font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#F3EFE6" text-anchor="middle">
      <circle cx="90" cy="130" r="20" fill="#0E2A3A" stroke="#2DD4BF"/><text x="90" y="134">USB</text>
      <circle cx="310" cy="130" r="20" fill="#0E2A3A" stroke="#2DD4BF"/><text x="310" y="134">QSPI</text>
      <circle cx="80" cy="230" r="20" fill="#0E2A3A" stroke="#2DD4BF"/><text x="80" y="234">LDO</text>
      <circle cx="320" cy="230" r="20" fill="#3A1414" stroke="#FF6B5E"/><text x="320" y="234">LED</text>
      <circle cx="140" cy="280" r="20" fill="#0E2A3A" stroke="#2DD4BF"/><text x="140" y="284">XTAL</text>
      <circle cx="260" cy="280" r="20" fill="#0E2A3A" stroke="#2DD4BF"/><text x="260" y="284">SW3</text>
    </g>
    <text x="24" y="340" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" fill="#F3EFE6">39 nets · 54 parts · ERC 0</text>
    <text x="24" y="362" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#2DD4BF" fill-opacity="0.75">universal-netlist ✓  →  Design.lean</text>
  </g>

  <path d="M478 300 C 520 300 530 300 572 300" stroke="#B9A7FF" stroke-width="4" fill="none" marker-end="url(#arr)"/>

  <!-- ===== panel 2: Lean kernel ===== -->
  <g transform="translate(600 110)">
    <ellipse cx="200" cy="190" rx="230" ry="200" fill="url(#glow)"/>
    <rect width="400" height="380" rx="18" fill="url(#card)" stroke="#B9A7FF" stroke-opacity="0.8" stroke-width="2"/>
    <text x="24" y="44" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#B9A7FF">2 · Lean 4 kernel</text>
    <text x="24" y="72" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#C9D3DC" fill-opacity="0.8">the only thing we trust</text>
    <!-- big turnstile -->
    <path d="M150 120 L 150 250 M150 185 L 260 185" stroke="#B9A7FF" stroke-width="14" stroke-linecap="round"/>
    <text x="276" y="200" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#F3EFE6">37</text>
    <text x="276" y="226" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#B9A7FF">theorems</text>
    <text x="24" y="300" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" fill="#F3EFE6">0 sorry · lake build ✓</text>
    <text x="24" y="326" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#C9D3DC" fill-opacity="0.8">26 by decide / simp / omega</text>
    <text x="24" y="348" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#F5A524" fill-opacity="0.85">11 by native_decide (netlist walks)</text>
  </g>

  <path d="M1018 300 C 1060 300 1070 300 1112 300" stroke="#B9A7FF" stroke-width="4" fill="none" marker-end="url(#arr)"/>

  <!-- ===== panel 3: outputs ===== -->
  <g transform="translate(1140 110)">
    <rect width="400" height="380" rx="18" fill="url(#card)" stroke="#FF6B5E" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="24" y="44" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#FF8A80">3 · LC-01 board</text>
    <text x="24" y="72" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#C9D3DC" fill-opacity="0.8">what the proofs guarantee</text>
    <!-- mini hex board -->
    <g transform="translate(200 175)">
      <polygon points="90,0 45,-78 -45,-78 -90,0 -45,78 45,78" fill="#15603F" stroke="#2E9A6C" stroke-width="2"/>
      <circle cx="40" cy="0" r="22" fill="#FF3B30" fill-opacity="0.25"/>
      <circle cx="-20" cy="-34.6" r="22" fill="#FF3B30" fill-opacity="0.25"/>
      <circle cx="-20" cy="34.6" r="22" fill="#FF3B30" fill-opacity="0.25"/>
      <g stroke="#F3EFE6" stroke-opacity="0.5">
        <rect x="35" y="-4" width="10" height="8" rx="1.5" fill="#FF6B5E"/>
        <rect x="-25" y="-38.6" width="10" height="8" rx="1.5" fill="#FF6B5E"/>
        <rect x="-25" y="30.6" width="10" height="8" rx="1.5" fill="#FF6B5E"/>
        <rect x="-45" y="-4" width="10" height="8" rx="1.5" fill="#5A2A2A"/>
        <rect x="15" y="-38.6" width="10" height="8" rx="1.5" fill="#5A2A2A"/>
        <rect x="15" y="30.6" width="10" height="8" rx="1.5" fill="#5A2A2A"/>
        <rect x="-5" y="-4" width="10" height="8" rx="1.5" fill="#FF8A80"/>
      </g>
    </g>
    <g font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#F3EFE6">
      <text x="24" y="288"><tspan fill="#B9A7FF">✓</tspan> fair dice &amp; 3-of-6 blinding</text>
      <text x="24" y="312"><tspan fill="#F5A524">✓</tspan> ≤ 9.81 mW · ≤ 3.09e16 γ/s per LED</text>
      <text x="24" y="336"><tspan fill="#2DD4BF">✓</tspan> LEDs → GPIO17–23 only</text>
      <text x="24" y="360"><tspan fill="#B9A7FF">✓</tspan> one roll per press</text>
    </g>
  </g>

  <text x="800" y="560" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" fill="#B9A7FF" fill-opacity="0.7">regenerate: python netlist/build_netlist.py → python lean/gen_from_design.py → lake build</text>
</svg>
