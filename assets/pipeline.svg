<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="LeanChip pipeline: the Sierrathon schematic PDF and BOM become a golden netlist; generated Lean data feeds the Lean 4 kernel, which proves 37 board theorems today with zeta lemmas in progress; the RP2040 zero-hunter computes Hardy Z(t) and locates zeros by sign changes, checked on the host against high-precision references (in progress)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0B1A33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
