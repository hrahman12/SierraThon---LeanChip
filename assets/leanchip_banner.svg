<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-label="LeanChip: a hexagonal RP2040 board whose seven red LEDs send 625 nanometre photons to sample wells, floating on a glowing logic turnstile, above the words LeanChip, every photon a theorem">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060B18"/>
      <stop offset="1" stop-color="#0B1A33"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D2440" stop-opacity="0"/>
      <stop offset="1" stop-color="#060B18"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F7A55"/>
      <stop offset="1" stop-color="#0E4632"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B3325"/>
      <stop offset="1" stop-color="#06221A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B9A7FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B9A7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5A4E" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#FF3B30" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cell" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.06"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>

  <!-- faint contours -->
  <g fill="none" stroke="#B9A7FF" stroke-opacity="0.07" stroke-width="1.5">
    <path d="M0 90 C 300 60 600 120 900 80 S 1400 50 1600 90"/>
    <path d="M0 150 C 300 120 600 180 900 140 S 1400 110 1600 150"/>
  </g>
  <!-- stars -->
  <g fill="#F3EFE6" opacity="0.5">
    <circle cx="1020" cy="52" r="1.4"/><circle cx="1560" cy="70" r="1.2"/><circle cx="1490" cy="250" r="1"/>
    <circle cx="930" cy="150" r="1"/><circle cx="1545" cy="190" r="1.3"/><circle cx="880" cy="40" r="1"/>
  </g>

  <!-- floor glow where the proofs drift -->
  <rect y="352" width="1600" height="168" fill="url(#floor)"/>

  <!-- ===== sample wells (quantum biology) with photons arriving ===== -->
  <g transform="translate(1460 120)">
    <g stroke="#2DD4BF" stroke-opacity="0.75" stroke-width="2">
      <circle cx="0" cy="0" r="34" fill="url(#cell)"/>
      <circle cx="10" cy="80" r="26" fill="url(#cell)"/>
      <circle cx="-30" cy="150" r="20" fill="url(#cell)" stroke-dasharray="4 5"/>
    </g>
    <!-- nuclei / mitochondria hints -->
    <g fill="#2DD4BF" fill-opacity="0.55">
      <circle cx="-8" cy="-6" r="7"/><ellipse cx="12" cy="10" rx="8" ry="3.5" transform="rotate(30 12 10)"/>
      <circle cx="16" cy="76" r="5"/><ellipse cx="0" cy="88" rx="6" ry="2.6" transform="rotate(-20 0 88)"/>
    </g>
    <text x="-40" y="196" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#2DD4BF" fill-opacity="0.7">sham</text>
  </g>

  <text x="1296" y="342" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="14" fill="#FF8A80" fill-opacity="0.85">λ = 625 nm · 1.98 eV</text>

  <!-- ===== the board: flat-top hexagon, centre (1150,240) ===== -->
  <g transform="translate(1150 240)">
    <!-- turnstile plinth, glowing under the board -->
    <ellipse cx="0" cy="184" rx="260" ry="46" fill="url(#glow)"/>
    <path d="M-210 170 L 210 170" stroke="#B9A7FF" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 170 L 0 228" stroke="#B9A7FF" stroke-width="7" stroke-linecap="round"/>
    <!-- board thickness + face (flat-top hexagon) -->
    <polygon points="190,10 95,174.5 -95,174.5 -190,10 -190,0 -95,164.5 95,164.5 190,0" fill="url(#edge)"/>
    <polygon points="190,0 95,-164.5 -95,-164.5 -190,0 -95,164.5 95,164.5" fill="url(#mask)" stroke="#2E9A6C" stroke-width="2"/>
    <polygon points="176,0 88,-152.4 -88,-152.4 -176,0 -88,152.4 88,152.4" fill="none" stroke="#F3EFE6" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="2 6"/>
    <g fill="none" stroke="#D9B45A" stroke-opacity="0.6" stroke-width="2.4" stroke-linecap="round">
      <path d="M90.0 -0.0 L 128.0 -0.0"/>
      <path d="M45.0 -77.9 L 64.0 -110.9"/>
      <path d="M-45.0 -77.9 L -64.0 -110.9"/>
      <path d="M-90.0 -0.0 L -128.0 -0.0"/>
      <path d="M-45.0 77.9 L -64.0 110.9"/>
      <path d="M45.0 77.9 L 64.0 110.9"/>
      <path d="M0 -10 L 0 -64"/>
      <path d="M-34 -128 L -46 -128"/>
      <path d="M34 -128 L 46 -128"/>
      <path d="M-34 -112 L -46 -112"/>
      <path d="M34 -112 L 46 -112"/>
    </g>
    <g fill="none" stroke="#B9A7FF" stroke-opacity="0.85" stroke-width="2.2" stroke-linejoin="round">
      <path d="M-38 -100 L -110 -100 L -150 -30 L -150 30 L -112 96 L -40 146"/>
      <path d="M-38 -94 L -106 -94 L -144 -28 L -144 28 L -107 91 L -34 141"/>
    </g>
    <rect x="104.5" y="-7.0" width="7" height="14" rx="1" fill="#1A1F2B" stroke="#C9D3DC" stroke-opacity="0.7" stroke-width="1" transform="rotate(90 108.0 -0.0)"/>
    <circle cx="128.0" cy="-0.0" r="3.6" fill="#06221A" stroke="#D9B45A" stroke-width="1.8"/>
    <rect x="50.5" y="-100.5" width="7" height="14" rx="1" fill="#1A1F2B" stroke="#C9D3DC" stroke-opacity="0.7" stroke-width="1" transform="rotate(30 54.0 -93.5)"/>
    <circle cx="64.0" cy="-110.9" r="3.6" fill="#06221A" stroke="#D9B45A" stroke-width="1.8"/>
    <rect x="-57.5" y="-100.5" width="7" height="14" rx="1" fill="#1A1F2B" stroke="#C9D3DC" stroke-opacity="0.7" stroke-width="1" transform="rotate(-30 -54.0 -93.5)"/>
    <circle cx="-64.0" cy="-110.9" r="3.6" fill="#06221A" stroke="#D9B45A" stroke-width="1.8"/>
    <rect x="-111.5" y="-7.0" width="7" height="14" rx="1" fill="#1A1F2B" stroke="#C9D3DC" stroke-opacity="0.7" stroke-width="1" transform="rotate(-90 -108.0 -0.0)"/>
    <circle cx="-128.0" cy="-0.0" r="3.6" fill="#06221A" stroke="#D9B45A" stroke-width="1.8"/>
    <rect x="-57.5" y="86.5" width="7" height="14" rx="1" fill="#1A1F2B" stroke="#C9D3DC" stroke-opacity="0.7" stroke-width="1" transform="rotate(-150 -54.0 93.5)"/>
    <circle cx="-64.0" cy="110.9" r="3.6" fill="#06221A" stroke="#D9B45A" stroke-width="1.8"/>
    <rect x="50.5" y="86.5" width="7" height="14" rx="1" fill="#1A1F2B" stroke="#C9D3DC" stroke-opacity="0.7" stroke-width="1" transform="rotate(-210 54.0 93.5)"/>
    <circle cx="64.0" cy="110.9" r="3.6" fill="#06221A" stroke="#D9B45A" stroke-width="1.8"/>
    <rect x="-3.5" y="-45" width="7" height="14" rx="1" fill="#1A1F2B" stroke="#C9D3DC" stroke-opacity="0.7" stroke-width="1"/>
    <circle cx="0" cy="-64" r="3.6" fill="#06221A" stroke="#D9B45A" stroke-width="1.8"/>
    <circle cx="-46" cy="-128" r="3.2" fill="#06221A" stroke="#D9B45A" stroke-width="1.6"/>
    <circle cx="46" cy="-128" r="3.2" fill="#06221A" stroke="#D9B45A" stroke-width="1.6"/>
    <circle cx="-46" cy="-112" r="3.2" fill="#06221A" stroke="#D9B45A" stroke-width="1.6"/>
    <circle cx="46" cy="-112" r="3.2" fill="#06221A" stroke="#D9B45A" stroke-width="1.6"/>
    <rect x="-34" y="-144" width="68" height="50" rx="4" fill="#1A1F2B" stroke="#3A4256" stroke-width="1.5"/>
    <g fill="#C9D3DC" fill-opacity="0.75">
      <rect x="-28" y="-148" width="56" height="3"/><rect x="-28" y="-93" width="56" height="3"/>
      <rect x="-38" y="-138" width="3" height="38"/><rect x="35" y="-138" width="3" height="38"/>
    </g>
    <circle cx="-26" cy="-136" r="2" fill="#C9D3DC" fill-opacity="0.8"/>
    <text x="0" y="-114" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#C9D3DC">RP2040</text>
    <rect x="-34" y="138" width="68" height="30" rx="9" fill="#C9D3DC" stroke="#9FB3C3" stroke-width="2"/>
    <rect x="-22" y="148" width="44" height="10" rx="5" fill="#2A3550"/>
    <rect x="148" y="-14" width="28" height="28" rx="4" fill="#2A3550" stroke="#C9D3DC" stroke-opacity="0.8" stroke-width="2"/>
    <circle cx="162" cy="0" r="8" fill="#C9D3DC" fill-opacity="0.85"/>
    <g fill="#06221A" stroke="#D9B45A" stroke-width="3">
      <circle cx="-100" cy="-128" r="9"/><circle cx="100" cy="-128" r="9"/>
      <circle cx="-86" cy="138" r="9"/><circle cx="86" cy="138" r="9"/>
    </g>
    <circle cx="40.0" cy="-69.3" r="48" fill="url(#redglow)"/>
    <circle cx="-80.0" cy="-0.0" r="48" fill="url(#redglow)"/>
    <circle cx="40.0" cy="69.3" r="48" fill="url(#redglow)"/>
    <circle cx="0" cy="0" r="30" fill="url(#redglow)" opacity="0.55"/>
    <g stroke="#F3EFE6" stroke-opacity="0.6" stroke-width="1.5">
      <rect x="71.0" y="-6.0" width="18" height="12" rx="2" fill="#5A2A2A"/>
      <rect x="31.0" y="-75.3" width="18" height="12" rx="2" fill="#FF6B5E"/>
      <rect x="-49.0" y="-75.3" width="18" height="12" rx="2" fill="#5A2A2A"/>
      <rect x="-89.0" y="-6.0" width="18" height="12" rx="2" fill="#FF6B5E"/>
      <rect x="-49.0" y="63.3" width="18" height="12" rx="2" fill="#5A2A2A"/>
      <rect x="31.0" y="63.3" width="18" height="12" rx="2" fill="#FF6B5E"/>
      <rect x="-9" y="-6" width="18" height="12" rx="2" fill="#FF8A80"/>
    </g>
    <text x="96" y="62" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#F3EFE6" fill-opacity="0.9">LC-01</text>
  </g>

  <!-- photons: 625 nm wave packets from the lit LEDs to the treated wells -->
  <g fill="none" stroke-linecap="round">
    <path d="M1200 168 q 8.0 -9 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" transform="rotate(-10.6 1200 168)" stroke="#FF3B30" stroke-opacity="0.25" stroke-width="8"/>
    <path d="M1200 168 q 8.0 -9 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" transform="rotate(-10.6 1200 168)" stroke="#FF6B5E" stroke-width="2.4"/>
    <path d="M1200 312 q 8.0 -9 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" transform="rotate(-23.0 1200 312)" stroke="#FF3B30" stroke-opacity="0.25" stroke-width="8"/>
    <path d="M1200 312 q 8.0 -9 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" transform="rotate(-23.0 1200 312)" stroke="#FF6B5E" stroke-width="2.4"/>
  </g>
  <g fill="#FF8A80">
    <polygon points="1420.2,120.7 1432.2,126.7 1420.2,132.7" transform="rotate(-10.6 1420.2 126.7)"/>
    <polygon points="1435.6,205.9 1447.6,211.9 1435.6,217.9" transform="rotate(-23.0 1435.6 211.9)"/>
  </g>

  <!-- ===== faint proofs drifting below: lavender = Lean, teal = netlist, amber = photonics ===== -->
  <g font-family="'JetBrains Mono',Consolas,'Courier New',monospace">
    <text x="40" y="392" font-size="17" fill="#B9A7FF" fill-opacity="0.42" transform="rotate(-2 40 392)">theorem roll_uniform : each face ↦ exactly 42 / 256 bytes</text>
    <text x="640" y="402" font-size="15" fill="#F5A524" fill-opacity="0.36" transform="rotate(1 640 402)">Φ ≤ I / e</text>
    <text x="300" y="420" font-size="14" fill="#2DD4BF" fill-opacity="0.32">led_gpio_map : D3 ↦ GPIO17 …</text>
    <text x="540" y="434" font-size="16" fill="#B9A7FF" fill-opacity="0.29" transform="rotate(-1 540 434)">∀ b &lt; 240, balanced (assign b)  ∎</text>
    <text x="40" y="438" font-size="14" fill="#F5A524" fill-opacity="0.29" transform="rotate(1 40 438)">E = hc / λ</text>
    <text x="40" y="508" font-size="15" fill="#B9A7FF" fill-opacity="0.32">⊢ fair</text>
    <text x="140" y="505" font-size="13" fill="#2DD4BF" fill-opacity="0.27" transform="rotate(-2 140 505)">theorem button_wiring</text>
    <text x="400" y="510" font-size="14" fill="#F5A524" fill-opacity="0.30" transform="rotate(1 400 510)">P_opt ≤ 9.81 mW  ∎</text>
    <text x="610" y="500" font-size="13" fill="#B9A7FF" fill-opacity="0.25">by decide</text>
    <text x="730" y="508" font-size="14" fill="#B9A7FF" fill-opacity="0.29" transform="rotate(-1 730 508)">uniform_over_designs</text>
    <text x="960" y="508" font-size="13" fill="#2DD4BF" fill-opacity="0.27">masks_only_touch_led_pins</text>
    <text x="1250" y="484" font-size="14" fill="#F5A524" fill-opacity="0.32" transform="rotate(-1 1250 484)">photon_ueV = 1983747  ∎</text>
    <text x="1290" y="512" font-size="13" fill="#B9A7FF" fill-opacity="0.27">never_double_counts</text>
    <text x="1480" y="452" font-size="14" fill="#B9A7FF" fill-opacity="0.29" transform="rotate(1 1480 452)">Q.E.D.</text>
    <text x="1495" y="404" font-size="13" fill="#B9A7FF" fill-opacity="0.25">∎</text>
  </g>

  <!-- ===== wordmark ===== -->
  <text x="88" y="250" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="128" font-weight="700" fill="#F3EFE6" letter-spacing="-2">Lean<tspan fill="#B9A7FF">Chip</tspan></text>
  <text x="92" y="312" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="30" fill="#B9A7FF">⊢ every photon a theorem</text>
  <text x="92" y="470" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="25" fill="#F3EFE6" fill-opacity="0.85">Sierrathon 2026 · verified photon-dose controller for quantum biology</text>
</svg>
