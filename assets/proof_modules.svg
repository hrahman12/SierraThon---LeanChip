<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 470" width="1600" height="470" role="img" aria-label="37 Lean theorems today: Hardware 4, Dice 7, Debounce 6, Rng 4, Electrical 4, plus 12 from the earlier quantum-biology iteration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0B1A33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111D36"/><stop offset="1" stop-color="#0B1528"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="470" fill="url(#bg)"/>
  <text x="60" y="58" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#F3EFE6">37 theorems today, <tspan fill="#B9A7FF">board first</tspan></text>
  <text x="60" y="88" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" fill="#C9D3DC" fill-opacity="0.75">bar = theorem count · dimmed = kept from the earlier quantum-bio iteration · zeta lemmas next</text>

  <g font-family="'JetBrains Mono',Consolas,monospace">
    <!-- card template: x offsets 60, 315, 570, 825, 1080, 1335 ; width 230 -->
    <g transform="translate(60 120)">
      <rect width="230" height="310" rx="16" fill="url(#card)" stroke="#F5A524" stroke-opacity="0.55"/>
      <text x="20" y="40" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#F5A524">Electrical</text>
      <text x="20" y="64" font-size="12" fill="#C9D3DC" fill-opacity="0.7">LED drive limits</text>
      <rect x="20" y="84" width="190" height="10" rx="5" fill="#1B2A40"/><rect x="20" y="84" width="69" height="10" rx="5" fill="#F5A524"/>
      <text x="20" y="128" font-size="34" font-weight="700" fill="#F3EFE6" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif">4</text>
      <text x="20" y="166" font-size="13" fill="#F3EFE6">I_LED ≤ 4.945 mA</text>
      <text x="20" y="188" font-size="13" fill="#F3EFE6">4 mA drive too low</text>
      <text x="20" y="210" font-size="13" fill="#F3EFE6">8 mA drive is enough</text>
      <text x="20" y="232" font-size="13" fill="#F3EFE6"
      <text x="20" y="254" font-size="13" fill="#F3EFE6">7 LEDs ≤ 50 mA</text>
      <text x="20" y="286" font-size="11" fill="#F5A524" fill-opacity="0.8">Photonics.lean (part)</text>
    </g>
    <g transform="translate(315 120)">
      <rect width="230" height="310" rx="16" fill="url(#card)" stroke="#B9A7FF" stroke-opacity="0.55"/>
      <text x="20" y="40" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#B9A7FF">Dice</text>
      <text x="20" y="64" font-size="12" fill="#C9D3DC" fill-opacity="0.7">faces → GPIO masks</text>
      <rect x="20" y="84" width="190" height="10" rx="5" fill="#1B2A40"/><rect x="20" y="84" width="121" height="10" rx="5" fill="#B9A7FF"/>
      <text x="20" y="128" font-size="34" font-weight="700" fill="#F3EFE6" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif">7</text>
      <text x="20" y="166" font-size="13" fill="#F3EFE6">face n lights n LEDs</text>
      <text x="20" y="188" font-size="13" fill="#F3EFE6">180° symmetric</text>
      <text x="20" y="210" font-size="13" fill="#F3EFE6">6 distinct masks</text>
      <text x="20" y="232" font-size="13" fill="#F3EFE6">GPIO17–23 only</text>
      <text x="20" y="286" font-size="11" fill="#B9A7FF" fill-opacity="0.8">Dice.lean</text>
    </g>
    <g transform="translate(570 120)">
      <rect width="230" height="310" rx="16" fill="url(#card)" stroke="#B9A7FF" stroke-opacity="0.55"/>
      <text x="20" y="40" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#B9A7FF">Debounce</text>
      <text x="20" y="64" font-size="12" fill="#C9D3DC" fill-opacity="0.7">SW3 state machine</text>
      <rect x="20" y="84" width="190" height="10" rx="5" fill="#1B2A40"/><rect x="20" y="84" width="104" height="10" rx="5" fill="#B9A7FF"/>
      <text x="20" y="128" font-size="34" font-weight="700" fill="#F3EFE6" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif">6</text>
      <text x="20" y="166" font-size="13" fill="#F3EFE6">&lt;5 ms glitch ignored</text>
      <text x="20" y="188" font-size="13" fill="#F3EFE6">no auto-repeat</text>
      <text x="20" y="210" font-size="13" fill="#F3EFE6">all 1024 traces:</text>
      <text x="20" y="232" font-size="13" fill="#F3EFE6">events ≤ presses</text>
      <text x="20" y="286" font-size="11" fill="#B9A7FF" fill-opacity="0.8">Debounce.lean</text>
    </g>
    <g transform="translate(1335 120)" opacity="0.45">
      <rect width="230" height="310" rx="16" fill="url(#card)" stroke="#C9D3DC" stroke-opacity="0.4"/>
      <text x="20" y="40" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#C9D3DC">Earlier</text>
      <text x="20" y="64" font-size="12" fill="#C9D3DC" fill-opacity="0.7">quantum-bio iteration</text>
      <rect x="20" y="84" width="190" height="10" rx="5" fill="#1B2A40"/><rect x="20" y="84" width="190" height="10" rx="5" fill="#C9D3DC"/>
      <text x="20" y="128" font-size="34" font-weight="700" fill="#F3EFE6" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif">12</text>
      <text x="20" y="166" font-size="13" fill="#F3EFE6">photon ceilings (7)</text>
      <text x="20" y="188" font-size="13" fill="#F3EFE6">3-of-6 blinding (5)</text>
      <text x="20" y="210" font-size="13" fill="#F3EFE6">still compile, not</text>
      <text x="20" y="232" font-size="13" fill="#F3EFE6">used by ZetaChip</text>
      <text x="20" y="286" font-size="11" fill="#C9D3DC" fill-opacity="0.8">Photonics · Protocol</text>
    </g>
    <g transform="translate(1080 120)">
      <rect width="230" height="310" rx="16" fill="url(#card)" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text x="20" y="40" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#2DD4BF">Hardware</text>
      <text x="20" y="64" font-size="12" fill="#C9D3DC" fill-opacity="0.7">walks the real netlist</text>
      <rect x="20" y="84" width="190" height="10" rx="5" fill="#1B2A40"/><rect x="20" y="84" width="69" height="10" rx="5" fill="#2DD4BF"/>
      <text x="20" y="128" font-size="34" font-weight="700" fill="#F3EFE6" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif">4</text>
      <text x="20" y="166" font-size="13" fill="#F3EFE6">GPIO→R→LED→GND</text>
      <text x="20" y="188" font-size="13" fill="#F3EFE6">D3 ↦ GPIO17 …</text>
      <text x="20" y="210" font-size="13" fill="#F3EFE6">7 distinct GPIOs</text>
      <text x="20" y="232" font-size="13" fill="#F3EFE6">SW3 = GPIO24, pull-up</text>
      <text x="20" y="286" font-size="11" fill="#2DD4BF" fill-opacity="0.8">Hardware.lean</text>
    </g>
    <g transform="translate(825 120)">
      <rect width="230" height="310" rx="16" fill="url(#card)" stroke="#B9A7FF" stroke-opacity="0.55"/>
      <text x="20" y="40" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#B9A7FF">Rng</text>
      <text x="20" y="64" font-size="12" fill="#C9D3DC" fill-opacity="0.7">fair rejection sampling</text>
      <rect x="20" y="84" width="190" height="10" rx="5" fill="#1B2A40"/><rect x="20" y="84" width="69" height="10" rx="5" fill="#B9A7FF"/>
      <text x="20" y="128" font-size="34" font-weight="700" fill="#F3EFE6" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif">4</text>
      <text x="20" y="166" font-size="13" fill="#F3EFE6">42 / 256 per face</text>
      <text x="20" y="188" font-size="13" fill="#F3EFE6">4 / 256 redrawn</text>
      <text x="20" y="210" font-size="13" fill="#F3EFE6">naive b%6 is biased</text>
      <text x="20" y="232" font-size="13" fill="#F3EFE6">result ∈ [1, 6]</text>
      <text x="20" y="286" font-size="11" fill="#B9A7FF" fill-opacity="0.8">Rng.lean</text>
    </g>
  </g>
</svg>
