firmware)</tspan></text><text x="3.6" y="-76.2" dominant-baseline="central" fill="#FF6B5E" font-size="15" font-family="JetBrains Mono" text-anchor="start"><tspan x="3.6" dy="15">BROKEN: 68 Ω chosen for a brighter LED</tspan></text><text x="3.6" y="89.8" dominant-baseline="central" fill="#FF6B5E" font-size="11" font-family="JetBrains Mono" text-anchor="start"><tspan x="3.6" dy="11">I = (3.35 − 1.8) V / (0.95 · 68 Ω) = 23.99 mA per pin  &gt;  8 mA</tspan></text><text x="3.6" y="109.60000000000001" dominant-baseline="central" fill="#FF6B5E" font-size="11" font-family="JetBrains Mono" text-anchor="start"><tspan x="3.6" dy="11">7 LEDs = 168 mA ≫ 50 mA GPIO budget → pads overloaded</tspan></text><text x="3.6" y="154.20000000000002" dominant-baseline="central" fill="#2DD4BF" font-size="15" font-family="JetBrains Mono" text-anchor="start"><tspan x="3.6" dy="15">FIXED BY LEAN: keep R = 330 Ω (BOM is fixed), set 8 mA pad drive</tspan></text><text x="3.6" y="327.40000000000003" dominant-baseline="central" fill="#2DD4BF" font-size="11" font-family="JetBrains Mono" text-anchor="start"><tspan x="3.6" dy="11">I ≤ 4.945 mA ≤ 8 mA and 7 · I = 34.6 mA ≤ 50 mA ✓</tspan></text><text x="3.6" y="347.20000000000005" dominant-baseline="central" fill="#2DD4BF" font-size="11" font-family="JetBrains Mono" text-anchor="start"><tspan x="3.6" dy="11">fixer also proves: smallest safe E24 = 240 Ω at 8 mA, 430 Ω at 4 mA</tspan></text><text x="3.6" y="368.0" dominant-baseline="central" fill="#B9A7FF" font-size="10" font-family="JetBrains Mono" text-anchor="start"><tspan x="3.6" dy="10">led_fails · led_design · led_found_8mA · led_found_4mA · led_sound · led_minimal_8mA</tspan></text><circle cx="57.6" cy="-0" r="2.7" style="stroke:#C9D3DC;fill:#c9d3dc;stroke-width:1.6;stroke-dasharray:-;" /><circle cx="57.6" cy="237.6" r="2.7" style="stroke:#C9D3DC;fill:#c9d3dc;stroke-width:1.6;stroke-dasharray:-;" /></svg>